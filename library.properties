sentence=Library for the Protocentral Pulse Express board (MAX30102 + MAX32664D).
paragraph=Driver for the ProtoCentral Pulse Express breakout — MAX30102 optical pulse-oximeter coupled to a MAX32664D biometric sensor hub running Maxim's blood-pressure-trending (BPT) algorithm. Selects the correct command set at runtime based on the hub firmware version, so it supports MAX32664D firmware revisions across the 40.x line including the 40.5.0+ multi-point calibration / 512-byte vector / YYYYMMDD changes. Exposes raw PPG, BPT calibration, and BPT estimation modes with explicit calibration-vector persistence. Version 2.0.0 is a clean break from 1.0.x — see README for migration notes.
