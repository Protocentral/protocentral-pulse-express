name=ProtoCentral Pulse Express SpO2 Heartrate and BPT sensor
version=2.2.0
author=Ashwin Whitchurch, Protocentral Electronics <support@protocentral.com>
maintainer=Protocentral Electronics <support@protocentral.com>
sentence=Library for the Protocentral Pulse Express board (MAX30102 + MAX32664D).
paragraph=Driver for the ProtoCentral Pulse Express breakout — MAX30102 optical pulse-oximeter coupled to a MAX32664D biometric sensor hub running Maxim's blood-pressure-trending (BPT) algorithm. Selects the correct command set at runtime based on the hub firmware version, so it supports MAX32664D firmware revisions across the 40.x line including the 40.5.0+ multi-point calibration / 512-byte vector / YYYYMMDD changes. Exposes raw PPG, heart rate, SpO2, BPT calibration and estimation, HRV, and a factory firmware-flashing helper. The main class is PulseExpress (the 2.0.x Max32664 name still works via a compatibility header). Not a medical device — for research and development use only.
category=Sensors
url=https://github.com/Protocentral/protocentral-pulse-express
